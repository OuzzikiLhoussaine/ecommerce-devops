apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: ecommerce
  labels:
    app: catalogue
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
        version: "1.0.0"
    spec:
      containers:
        - name: catalogue
          image: localhost:5000/ecommerce/catalogue:v1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: mongodb://mongo-catalogue:27017
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
