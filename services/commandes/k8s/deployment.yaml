apiVersion: apps/v1
kind: Deployment
metadata:
  name: commandes
  namespace: ecommerce
  labels:
    app: commandes
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commandes
  template:
    metadata:
      labels:
        app: commandes
        version: "1.0.0"
    spec:
      containers:
        - name: commandes
          image: localhost:5000/ecommerce/commandes:v1.0.0
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: mongodb://mongo-commandes:27017
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: commandes
  namespace: ecommerce
  labels:
    app: commandes
spec:
  type: NodePort
  selector:
    app: commandes
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30083
