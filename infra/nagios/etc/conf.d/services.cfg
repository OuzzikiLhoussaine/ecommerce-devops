# Supervision INDIVIDUELLE des 3 microservices + du point d'entree.
# check_tcp verifie le port NodePort mappe sur l'hote par kind.
define service {
  use                     generic-service
  host_name               kind-cluster
  service_description     Microservice Catalogue 
  check_command           check_tcp!30081
  check_interval          1
  retry_interval          1
  max_check_attempts      2
  notification_interval   5
}

define service {
  use                     generic-service
  host_name               kind-cluster
  service_description     Microservice Panier 
  check_command           check_tcp!30082
  check_interval          1
  retry_interval          1
  max_check_attempts      2
  notification_interval   5
}

define service {
  use                     generic-service
  host_name               kind-cluster
  service_description     Microservice Commandes 
  check_command           check_tcp!30083
  check_interval          1
  retry_interval          1
  max_check_attempts      2
  notification_interval   5
}

define service {
  use                     generic-service
  host_name               kind-cluster
  service_description     Gateway API 30080
  check_command           check_tcp!30080
  check_interval          1
  retry_interval          1
  max_check_attempts      2
  notification_interval   5
}
