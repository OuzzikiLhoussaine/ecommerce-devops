# Un seul "host" physique : le docker hote qui expose les NodePorts
# du cluster kind (30080-30083). 172.17.0.1 = passerelle du bridge
# docker, visible depuis le conteneur Nagios.
define host {
  use                     linux-server
  host_name               kind-cluster
  alias                   Cluster kind - plateforme e-commerce
  address                 172.17.0.1
}
