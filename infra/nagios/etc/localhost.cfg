# Replaces the image's default localhost.cfg: same host definition,
# but WITHOUT the default HTTP/SSH/disk etc. service checks that
# fail inside the container and pollute the supervision dashboards.
# Only our 4 real microservices (+ gateway) are monitored.

define host {
  use                     linux-server
  host_name               localhost
  alias                   Nagios
  address                 127.0.0.1
}
